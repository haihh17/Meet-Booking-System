<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Student Meeting Booking</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

  <div class="app">

    <div class="container">


      <!-- HEADER -->

      <header class="header">

        <div class="eyebrow">
          Student Consultation
        </div>

        <h1 class="title">
          Book a Meeting
        </h1>

        <p class="subtitle">
          Chọn thời gian phù hợp để trao đổi về bài,
          project hoặc feedback.
        </p>

      </header>


      <!-- STATUS -->

      <div id="status">
        Đang tải lịch...
      </div>

      <div
        id="error"
        class="error hidden"
      ></div>


      <!-- MONTH -->

      <section class="section">

        <div class="section-label">
          01 — Chọn tháng
        </div>

        <div
          id="monthOptions"
          class="options"
        ></div>

      </section>


      <!-- WEEKDAY -->

      <section
        id="weekdaySection"
        class="section hidden"
      >

        <div class="section-label">
          02 — Chọn thứ
        </div>

        <div
          id="weekdayOptions"
          class="options"
        ></div>

      </section>


      <!-- DATE -->

      <section
        id="dateSection"
        class="section hidden"
      >

        <div class="section-label">
          03 — Chọn ngày
        </div>

        <div
          id="dateOptions"
          class="dates"
        ></div>

      </section>


      <!-- TIME -->

      <section
        id="timeSection"
        class="section hidden"
      >

        <div class="section-label">
          04 — Chọn khung giờ
        </div>

        <div
          id="timeOptions"
          class="times"
        ></div>

      </section>


<!-- SUMMARY -->

<section
  id="summarySection"
  class="section hidden"
>

  <div class="section-label">
    04 — Xác nhận thời gian
  </div>

  <div class="summary">

    <div class="summary-title">
      Lịch meeting đã chọn
    </div>

    <div
      id="summaryValue"
      class="summary-value"
    ></div>

  </div>

</section>


<!-- STUDENT INFORMATION -->

<section
  id="studentSection"
  class="section hidden"
>

  <div class="section-label">
    05 — Thông tin của bạn
  </div>


  <form id="bookingForm">

    <!-- NAME -->

    <div class="form-group">

      <label for="studentName">
        Họ và tên
      </label>

      <input
        id="studentName"
        name="studentName"
        type="text"
        placeholder="Nhập họ và tên"
        autocomplete="name"
        required
      >

      <div
        class="field-error"
        id="nameError"
      ></div>

    </div>


    <!-- MSSV -->

    <div class="form-group">

      <label for="studentMssv">
        MSSV
      </label>

      <input
        id="studentMssv"
        name="studentMssv"
        type="text"
        placeholder="Nhập mã số sinh viên"
        autocomplete="off"
        required
      >

      <div
        class="field-error"
        id="mssvError"
      ></div>

    </div>


    <!-- EMAIL -->

    <div class="form-group">

      <label for="studentEmail">
        Email
      </label>

      <input
        id="studentEmail"
        name="studentEmail"
        type="email"
        placeholder="example@email.com"
        autocomplete="email"
        required
      >

      <div
        class="field-error"
        id="emailError"
      ></div>

    </div>


    <!-- TOPIC -->

    <div class="form-group">

      <label for="studentTopic">
        Bạn muốn trao đổi gì?
      </label>

      <textarea
        id="studentTopic"
        name="studentTopic"
        rows="4"
        placeholder="Ví dụ: Em muốn hỏi về concept, layout hoặc feedback Assignment 2."
        required
      ></textarea>

      <div
        class="field-error"
        id="topicError"
      ></div>

    </div>


    <!-- CONFIRM -->

    <button
      id="confirmButton"
      class="confirm-button"
      type="submit"
      disabled
    >
      Xác nhận booking
    </button>


    <div
      id="formMessage"
      class="form-message"
    ></div>

  </form>

</section>


    </div>

  </div>


  <!-- API -->

  <script src="js/api.js"></script>

  <!-- APP -->

  <script src="js/app.js"></script>


</body>

</html>
