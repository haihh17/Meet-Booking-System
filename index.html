<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Student Meeting Booking</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

  <div class="app">

    <div class="container">


      <!-- HEADER -->

      <header class="header">

        <div class="eyebrow">
          Student Consultation
        </div>

        <h1 class="title">
          Book a Meeting
        </h1>

        <p class="subtitle">
          Chọn thời gian phù hợp để trao đổi về bài,
          project hoặc feedback.
        </p>

      </header>


      <!-- STATUS -->

      <div id="status">
        Đang tải lịch...
      </div>

      <div
        id="error"
        class="error hidden"
      ></div>


      <!-- MONTH -->

      <section class="section">

        <div class="section-label">
          01 — Chọn tháng
        </div>

        <div
          id="monthOptions"
          class="options"
        ></div>

      </section>


      <!-- WEEKDAY -->

      <section
        id="weekdaySection"
        class="section hidden"
      >

        <div class="section-label">
          02 — Chọn thứ
        </div>

        <div
          id="weekdayOptions"
          class="options"
        ></div>

      </section>


      <!-- DATE -->

      <section
        id="dateSection"
        class="section hidden"
      >

        <div class="section-label">
          03 — Chọn ngày
        </div>

        <div
          id="dateOptions"
          class="dates"
        ></div>

      </section>


      <!-- TIME -->

      <section
        id="timeSection"
        class="section hidden"
      >

        <div class="section-label">
          04 — Chọn khung giờ
        </div>

        <div
          id="timeOptions"
          class="times"
        ></div>

      </section>


      <!-- SUMMARY -->

      <section
        id="summarySection"
        class="section hidden"
      >

        <div class="section-label">
          Đã chọn
        </div>

        <div class="summary">

          <div class="summary-title">
            Lịch meeting
          </div>

          <div
            id="summaryValue"
            class="summary-value"
          ></div>

        </div>

      </section>


    </div>

  </div>


  <!-- API -->

  <script src="js/api.js"></script>

  <!-- APP -->

  <script src="js/app.js"></script>


</body>

</html>
